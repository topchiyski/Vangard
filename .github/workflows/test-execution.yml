name: Vanguard tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 2 * * *" # nightly 02:00 UTC: full load (+ mobile when MOBILE_ENABLED is true)
  workflow_dispatch:
    inputs:
      environment:
        description: Environment
        type: choice
        options: [qa, staging, prod]
        default: qa
      suites:
        description: "Suites to run (comma separated: api,web,e2e,load,mobile-android,mobile-ios). Mobile also needs the MOBILE_ENABLED repo variable."
        type: string
        default: api,web,e2e,load
      cucumber_tags:
        description: Cucumber tag expression
        type: string
        default: not @wip
      browser_mode:
        description: Web browser mode
        type: choice
        options: [desktop, mobile]
        default: desktop
      mobile_target:
        description: Where mobile tests run
        type: choice
        options: [local, browserstack]
        default: local
      load_profile:
        description: Load profile (smoke = 5 users / 15 s)
        type: choice
        options: [smoke, full]
        default: smoke
      upload_to_xray:
        description: Upload results to Jira Xray
        type: boolean
        default: false

concurrency:
  group: vanguard-${{ github.ref }}
  cancel-in-progress: true

env:
  ENVIRONMENT: ${{ inputs.environment || 'qa' }}
  TAGS: ${{ inputs.cucumber_tags || 'not @wip' }}
  SUITES: ${{ inputs.suites || 'api,web,e2e,load' }}
  IS_NIGHTLY: ${{ github.event_name == 'schedule' }}
  APPLITOOLS_API_KEY: ${{ secrets.APPLITOOLS_API_KEY }}
  BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
  BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
  MAVEN_ARGS: >-
    -B --no-transfer-progress
    -Denv=${{ inputs.environment || 'qa' }}
    -Dvanguard.report.skip=true

jobs:
  api-web-e2e:
    name: API + Web + E2E
    if: contains(inputs.suites || 'api,web,e2e', 'api') || contains(inputs.suites || 'web', 'web') || contains(inputs.suites || 'e2e', 'e2e')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: browser-actions/setup-chrome@v1
      - name: Run tests
        run: >
          mvn clean verify $MAVEN_ARGS
          -pl vanguard-api,vanguard-web,vanguard-e2e -am
          -Dbrowser.mode=${{ inputs.browser_mode || 'desktop' }}
          -Dvisual.enabled=${{ secrets.APPLITOOLS_API_KEY != '' }}
          "-Dcucumber.filter.tags=${TAGS}"
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-api-web-e2e
          path: |
            */target/allure-results
            */target/cucumber-reports/cucumber.json

  load:
    name: Load (Gatling)
    if: contains(inputs.suites || 'load', 'load')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Run load tests
        # PRs and pushes: smoke (5 users / 15 s). Nightly or manual "full": the real load.
        run: >
          mvn clean verify $MAVEN_ARGS
          -pl vanguard-load -am
          -Dload.profile=${{ github.event_name == 'schedule' && 'full' || inputs.load_profile || 'smoke' }}
          "-Dcucumber.filter.tags=${TAGS}"
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-load
          path: |
            vanguard-load/target/allure-results
            vanguard-load/target/cucumber-reports/cucumber.json
            vanguard-load/target/gatling

  mobile-android:
    name: Mobile (Android)
    # Off until the mobile apps are set up: set the repo variable MOBILE_ENABLED=true to turn it on
    # (Settings > Secrets and variables > Actions > Variables). Then: nightly, or when requested manually.
    if: vars.MOBILE_ENABLED == 'true' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && contains(inputs.suites, 'mobile-android')))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Appium
        if: inputs.mobile_target != 'browserstack'
        run: |
          npm install -g appium
          appium driver install uiautomator2
      - name: Download sample apps
        run: ./scripts/download-sample-apps.sh
      - name: Enable KVM (hardware acceleration for the emulator)
        if: inputs.mobile_target != 'browserstack'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run on an Android emulator
        if: inputs.mobile_target != 'browserstack'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_7
          script: mvn clean verify $MAVEN_ARGS -Pmobile -pl vanguard-mobile -am -Dmobile.platform=android "-Dcucumber.filter.tags=${TAGS} and not @ios"
      - name: Run on BrowserStack
        if: inputs.mobile_target == 'browserstack'
        run: >
          mvn clean verify $MAVEN_ARGS -Pmobile -pl vanguard-mobile -am
          -Dmobile.platform=android -Dmobile.target=browserstack
          "-Dmobile.android.device=Google Pixel 7" -Dmobile.android.version=13.0
          "-Dcucumber.filter.tags=${TAGS} and not @ios"
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-mobile-android
          path: |
            vanguard-mobile/target/allure-results
            vanguard-mobile/target/cucumber-reports/cucumber.json

  mobile-ios:
    name: Mobile (iOS)
    # Off until the mobile apps are set up: same MOBILE_ENABLED switch as Android.
    if: vars.MOBILE_ENABLED == 'true' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && contains(inputs.suites, 'mobile-ios')))
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Appium
        if: inputs.mobile_target != 'browserstack'
        run: |
          npm install -g appium
          appium driver install xcuitest
      - name: Download sample apps
        run: ./scripts/download-sample-apps.sh
      - name: Pick an available iPhone simulator
        if: inputs.mobile_target != 'browserstack'
        run: |
          DEVICE=$(xcrun simctl list devices available | grep -m1 -oE "iPhone [0-9]+( Pro)?" )
          RUNTIME=$(xcrun simctl list runtimes | grep -m1 -oE "iOS [0-9]+\.[0-9]+" | cut -d' ' -f2)
          echo "IOS_DEVICE=$DEVICE" >> "$GITHUB_ENV"
          echo "IOS_VERSION=$RUNTIME" >> "$GITHUB_ENV"
      - name: Run on an iOS simulator
        if: inputs.mobile_target != 'browserstack'
        run: >
          mvn clean verify $MAVEN_ARGS -Pmobile -pl vanguard-mobile -am
          -Dmobile.platform=ios "-Dmobile.ios.device=${IOS_DEVICE}" -Dmobile.ios.version=${IOS_VERSION}
          "-Dcucumber.filter.tags=${TAGS} and not @android"
      - name: Run on BrowserStack
        if: inputs.mobile_target == 'browserstack'
        # Real iPhones need the .ipa build: set -Dmobile.ios.app to it (see docs/MOBILE_SETUP.md).
        run: >
          mvn clean verify $MAVEN_ARGS -Pmobile -pl vanguard-mobile -am
          -Dmobile.platform=ios -Dmobile.target=browserstack
          "-Dmobile.ios.device=iPhone 15" -Dmobile.ios.version=17
          "-Dcucumber.filter.tags=${TAGS} and not @android"
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-mobile-ios
          path: |
            vanguard-mobile/target/allure-results
            vanguard-mobile/target/cucumber-reports/cucumber.json

  report:
    name: Combined report + Xray
    needs: [api-web-e2e, load, mobile-android, mobile-ios]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Download all results
        uses: actions/download-artifact@v4
        with:
          path: downloaded-results
      - name: Build the reporting tool
        run: mvn -B --no-transfer-progress -q install -DskipTests -pl vanguard-reporting -am -Dvanguard.report.skip=true
      - name: Merge results, upload to Xray, decide pass/fail
        env:
          XRAY_CLIENT_ID: ${{ secrets.XRAY_CLIENT_ID }}
          XRAY_CLIENT_SECRET: ${{ secrets.XRAY_CLIENT_SECRET }}
        run: >
          mvn -B --no-transfer-progress exec:java -pl vanguard-reporting
          -Dexec.mainClass=com.vanguard.reporting.ReportAggregator
          "-Dexec.args=--root ${{ github.workspace }} --input ${{ github.workspace }}/downloaded-results"
          -Denv=${ENVIRONMENT}
          -Dxray.upload.enabled=${{ inputs.upload_to_xray || false }}
      - name: Generate Allure HTML report
        if: always()
        run: mvn -B --no-transfer-progress -N allure:report
      - name: Upload combined report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vanguard-report
          path: |
            target/site/allure-maven-plugin
            target/cucumber-reports/cucumber.json
